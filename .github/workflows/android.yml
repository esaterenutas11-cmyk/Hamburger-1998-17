# Google Play için imzalı AAB + telefona kurulabilir APK üretir.
# Çalıştırma: GitHub › Actions › "Android derleme" › Run workflow  (ya da main dalına her yüklemede otomatik)
# Çıktılar: işin sayfasının en altındaki "Artifacts" bölümünde.
name: Android derleme
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["magaza/**", "**.md"]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Web oyun kontrolü
        run: node scripts/check-web.mjs

      - name: Paketler
        run: |
          exec > >(tee -a "$RUNNER_TEMP/derleme.log") 2>&1
          npm install --no-audit --no-fund
          node scripts/native-setup.mjs deps

      - name: Android projesi
        run: |
          exec > >(tee -a "$RUNNER_TEMP/derleme.log") 2>&1
          rm -rf android
          npx cap add android
          node scripts/native-setup.mjs android
          npx cap sync android

      - name: İmza anahtarı
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/derleme.log") 2>&1
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "CBL_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "✔ imza anahtarı yüklendi"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 gizli değişkeni yok: AAB imzasız üretilecek (Play Console kabul etmez)"
          fi

      - name: Derle (AAB + APK)
        working-directory: android
        env:
          CBL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CBL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CBL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/derleme.log") 2>&1
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease assembleDebug

      - name: Lint (uyarı amaçlı)
        continue-on-error: true
        working-directory: android
        run: ./gradlew --no-daemon lintRelease

      - name: İmza kontrolü
        if: env.CBL_KEYSTORE != ''
        run: |
          exec > >(tee -a "$RUNNER_TEMP/derleme.log") 2>&1
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab)
          jarsigner -verify "$AAB" | tail -1
          jarsigner -verify "$AAB" | grep -q "jar verified" || (echo "::error::AAB imzalı değil" && exit 1)

      - name: Dosyaları adlandır
        run: |
          exec > >(tee -a "$RUNNER_TEMP/derleme.log") 2>&1
          mkdir -p cikti
          V=$(node -p "require('./uygulama-ayarlari.json').surum")
          cp android/app/build/outputs/bundle/release/*.aab "cikti/CouplesBurgerLife-$V-$BUILD_NUMBER-GooglePlay.aab"
          cp android/app/build/outputs/apk/release/*.apk "cikti/CouplesBurgerLife-$V-$BUILD_NUMBER-telefona-kur.apk" 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/*.apk "cikti/CouplesBurgerLife-$V-$BUILD_NUMBER-test.apk"
          ls -la cikti

      - uses: actions/upload-artifact@v5
        with:
          name: android-${{ github.run_number }}
          path: cikti/
          retention-days: 30

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-lint-${{ github.run_number }}
          path: android/app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Hata özeti
        if: failure()
        run: |
          T=$(tail -n 80 "$RUNNER_TEMP/derleme.log" 2>/dev/null | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Derleme hatası::$T"
